name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main

env:
  IMAGE: bg

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.CICD_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: binarygarden

      - name: Authenticate Docker to Google Cloud Artifact Registry
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: us-central1-docker.pkg.dev/binarygarden/bg-images/${{ env.IMAGE }}:${{ github.sha }}
          no-cache: true

      # --clear-secrets drops secret refs stored on the service by earlier
      # deploys (the removed EMAILJS_* secrets); swap for --set-secrets if the
      # service ever needs secrets again
      - name: Deploy to Google Cloud Run
        run: |
          gcloud run deploy binary-garden \
          --image us-central1-docker.pkg.dev/binarygarden/bg-images/${{ env.IMAGE }}:${{ github.sha }} \
          --port=3000 \
          --region us-central1 \
          --allow-unauthenticated \
          --service-account bg-cicd@binarygarden.iam.gserviceaccount.com \
          --clear-secrets
